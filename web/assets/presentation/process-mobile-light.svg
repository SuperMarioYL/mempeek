<svg xmlns="http://www.w3.org/2000/svg" width="400" height="685" viewBox="0 0 400 685" data-palette="bb56e6-e76aca-c5acf6-7319122af072" role="img" aria-labelledby="process-mobile-light-title process-mobile-light-desc"><title id="process-mobile-light-title">MemPeek process</title><desc id="process-mobile-light-desc">The receipt omits the full memory text; the local event carries it.</desc><defs><linearGradient id="brand" gradientUnits="userSpaceOnUse" x2="400" y2="685"><stop stop-color="#a04ac5"/><stop offset=".6" stop-color="#ab4e96"/><stop offset="1" stop-color="#796997"/></linearGradient><radialGradient id="halo"><stop stop-color="#a04ac5" stop-opacity=".22"/><stop offset="1" stop-color="#fdf9fe" stop-opacity="0"/></radialGradient><filter id="glow"><feGaussianBlur stdDeviation="5"/></filter><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#ebcbf7" stroke-opacity=".35" stroke-width=".6"/></pattern><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="m1 1 7 4-7 4" fill="none" stroke="#a04ac5" stroke-width="1.5"/></marker></defs><style>text{font-family:Arial,"Noto Sans",sans-serif}.flow{stroke-dasharray:10 110;animation:flow 6s linear infinite}.pulse{animation:pulse 5s ease-in-out infinite}.turn{transform-box:fill-box;transform-origin:center;animation:turn 36s linear infinite}@keyframes flow{to{stroke-dashoffset:-360}}@keyframes pulse{0%,100%{opacity:.45}50%{opacity:1}}@keyframes turn{to{transform:rotate(360deg)}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transform:none!important}.flow{display:none}}</style><rect width="400" height="685" rx="16" fill="#fdf9fe"/><rect width="400" height="685" rx="16" fill="url(#grid)"/><ellipse cx="252.0" cy="294.55" rx="200.0" ry="479.49999999999994" fill="url(#halo)"/><text x="28" y="44" fill="#695e88" font-size="13" text-anchor="start" font-weight="400">PROCESS / FROM INPUT TO RESULT</text><text x="28" y="84.0" fill="#211630" font-size="25" text-anchor="start" font-weight="400">MemPeek / example</text><text x="28" y="119.0" fill="#211630" font-size="25" text-anchor="start" font-weight="400">workflow</text><path d="M200 257V290" fill="none" stroke="#a04ac5" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M200 257V290" class="flow" fill="none" stroke="#796997" stroke-width="2"/><rect x="28" y="135" width="344" height="122" rx="12" fill="#fcf7fe" stroke="#ebcbf7"/><text x="46" y="166.0" fill="#211630" font-size="21" text-anchor="start" font-weight="400">01  Write two memories</text><text x="46" y="218.0" fill="#695e88" font-size="17" text-anchor="start" font-weight="400">Explicit synthetic inputs</text><path d="M200 412V445" fill="none" stroke="#a04ac5" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M200 412V445" class="flow" fill="none" stroke="#796997" stroke-width="2"/><rect x="28" y="290" width="344" height="122" rx="12" fill="#fcf7fe" stroke="#ebcbf7"/><text x="46" y="321.0" fill="#211630" font-size="21" text-anchor="start" font-weight="400">02  Recall one entry</text><text x="46" y="373.0" fill="#695e88" font-size="17" text-anchor="start" font-weight="400">Session-scoped similarity</text><rect x="28" y="445" width="344" height="122" rx="12" fill="#fcf7fe" stroke="#ebcbf7"/><text x="46" y="476.0" fill="#211630" font-size="21" text-anchor="start" font-weight="400">03  Split the result</text><text x="46" y="528.0" fill="#695e88" font-size="17" text-anchor="start" font-weight="400">Receipt and event content</text><text x="28" y="620.0" fill="#796997" font-size="18" text-anchor="start" font-weight="400">The receipt omits the full memory</text><text x="28" y="645.2" fill="#796997" font-size="18" text-anchor="start" font-weight="400">text; the local event carries it.</text></svg>
