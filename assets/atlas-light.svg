<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 380" width="880" height="380"
     font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif"
     role="img" aria-label="MemPeek architecture: Agent talks MCP stdio to MemPeek server, which persists to SQLite and streams full recall via SSE to the dashboard while returning only a fixed-size receipt to the agent.">
  <defs>
    <marker id="ah-l" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#B9B9C2"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="880" height="380" fill="#F5F5F7"/>

  <!-- static connectors (underneath) -->
  <g stroke="#C9C9D0" stroke-width="1.5" fill="none">
    <line x1="210" y1="104" x2="349" y2="104" marker-end="url(#ah-l)"/>
    <line x1="355" y1="128" x2="216" y2="128" marker-end="url(#ah-l)"/>
    <line x1="525" y1="110" x2="664" y2="110" marker-end="url(#ah-l)"/>
    <path d="M755,150 L755,210 L440,210 L440,244" marker-end="url(#ah-l)"/>
  </g>

  <!-- marching dash data-flow (overlaid, semantic colors) -->
  <g stroke-width="1.5" fill="none" stroke-linecap="round">
    <!-- C1 Agent -> MCP (write) -->
    <line x1="210" y1="104" x2="346" y2="104" stroke="#5E5CE6" stroke-opacity="0.5" stroke-dasharray="6 10">
      <animate attributeName="stroke-dashoffset" from="32" to="0" dur="1.6s" repeatCount="indefinite"/>
    </line>
    <!-- C2 MCP -> Agent (receipt, O(1)) -->
    <line x1="355" y1="128" x2="219" y2="128" stroke="#0071E3" stroke-opacity="0.5" stroke-dasharray="6 10">
      <animate attributeName="stroke-dashoffset" from="32" to="0" dur="1.6s" begin="-0.8s" repeatCount="indefinite"/>
    </line>
    <!-- C3 MCP -> SQLite (persist) -->
    <line x1="525" y1="110" x2="661" y2="110" stroke="#0071E3" stroke-opacity="0.5" stroke-dasharray="6 10">
      <animate attributeName="stroke-dashoffset" from="32" to="0" dur="1.6s" begin="-0.4s" repeatCount="indefinite"/>
    </line>
    <!-- C4 SQLite -> Dashboard (SSE side-channel) -->
    <path d="M755,150 L755,210 L440,210 L440,241" stroke="#10A37F" stroke-opacity="0.5" stroke-dasharray="6 10">
      <animate attributeName="stroke-dashoffset" from="32" to="0" dur="2s" begin="-1.0s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- data packets (animateMotion along connectors) -->
  <g>
    <circle r="3" fill="#5E5CE6">
      <animateMotion path="M210,104 L346,104" dur="2.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.85;1" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <circle r="3" fill="#0071E3">
      <animateMotion path="M355,128 L219,128" dur="2.4s" begin="-1.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.85;1" dur="2.4s" begin="-1.2s" repeatCount="indefinite"/>
    </circle>
    <circle r="3" fill="#0071E3">
      <animateMotion path="M525,110 L661,110" dur="2.4s" begin="-0.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.85;1" dur="2.4s" begin="-0.6s" repeatCount="indefinite"/>
    </circle>
    <circle r="3" fill="#10A37F">
      <animateMotion path="M755,150 L755,210 L440,210 L440,241" dur="3.2s" begin="-1.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.12;0.88;1" dur="3.2s" begin="-1.6s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- connector labels -->
  <g font-size="11" fill="#6E6E73" font-weight="500">
    <text x="282" y="98" text-anchor="middle">write</text>
    <text x="282" y="142" text-anchor="middle">receipt · O(1)</text>
    <text x="593" y="104" text-anchor="middle">persist</text>
    <text x="600" y="204" text-anchor="middle">SSE · full recall → dashboard</text>
  </g>

  <!-- nodes -->
  <g>
    <!-- Agent (purple) -->
    <rect x="40" y="70" width="170" height="80" rx="15" fill="#5E5CE6" fill-opacity="0.10" stroke="#5E5CE6" stroke-width="1.5">
      <animate attributeName="fill-opacity" values="0.10;0.18;0.10" keyTimes="0;0.5;1" dur="3.2s"
               calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1" repeatCount="indefinite"/>
    </rect>
    <text x="125" y="105" text-anchor="middle" font-size="14" font-weight="600" fill="#4B3FC4">AI Agent</text>
    <text x="125" y="124" text-anchor="middle" font-size="11" fill="#6E6E73">Claude Code · Cursor</text>

    <!-- MemPeek MCP (blue, primary) -->
    <rect x="355" y="70" width="170" height="80" rx="15" fill="#0071E3" fill-opacity="0.10" stroke="#0071E3" stroke-width="1.5">
      <animate attributeName="fill-opacity" values="0.10;0.18;0.10" keyTimes="0;0.5;1" dur="3.2s" begin="-1.1s"
               calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1" repeatCount="indefinite"/>
    </rect>
    <text x="440" y="105" text-anchor="middle" font-size="14" font-weight="600" fill="#0A4F9E">MemPeek MCP</text>
    <text x="440" y="124" text-anchor="middle" font-size="11" fill="#6E6E73">ZTMR server · Node 22</text>

    <!-- SQLite Store (teal) -->
    <rect x="670" y="70" width="170" height="80" rx="15" fill="#10A37F" fill-opacity="0.10" stroke="#10A37F" stroke-width="1.5">
      <animate attributeName="fill-opacity" values="0.10;0.18;0.10" keyTimes="0;0.5;1" dur="3.2s" begin="-2.2s"
               calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1" repeatCount="indefinite"/>
    </rect>
    <text x="755" y="105" text-anchor="middle" font-size="14" font-weight="600" fill="#0B6B53">SQLite Store</text>
    <text x="755" y="124" text-anchor="middle" font-size="11" fill="#6E6E73">mempeek.db</text>

    <!-- Dashboard (purple, agent-facing surface) -->
    <rect x="355" y="250" width="170" height="80" rx="15" fill="#5E5CE6" fill-opacity="0.10" stroke="#5E5CE6" stroke-width="1.5">
      <animate attributeName="fill-opacity" values="0.10;0.18;0.10" keyTimes="0;0.5;1" dur="3.2s" begin="-0.55s"
               calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1" repeatCount="indefinite"/>
    </rect>
    <text x="440" y="285" text-anchor="middle" font-size="14" font-weight="600" fill="#4B3FC4">Dashboard</text>
    <text x="440" y="304" text-anchor="middle" font-size="11" fill="#6E6E73">localhost:7331</text>
  </g>
</svg>
