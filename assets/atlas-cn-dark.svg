<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 380" width="880" height="380"
     font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif"
     role="img" aria-label="MemPeek 架构：Agent 通过 MCP stdio 与 MemPeek 服务通信，写入持久化到 SQLite，回看时全量召回经 SSE 流向仪表盘，模型只收到固定大小的回执。">
  <defs>
    <marker id="ah-d" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#5A5A66"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="880" height="380" fill="#1D1D1F"/>

  <g stroke="#3A3A44" stroke-width="1.5" fill="none">
    <line x1="210" y1="104" x2="349" y2="104" marker-end="url(#ah-d)"/>
    <line x1="355" y1="128" x2="216" y2="128" marker-end="url(#ah-d)"/>
    <line x1="525" y1="110" x2="664" y2="110" marker-end="url(#ah-d)"/>
    <path d="M755,150 L755,210 L440,210 L440,244" marker-end="url(#ah-d)"/>
  </g>

  <g stroke-width="1.5" fill="none" stroke-linecap="round">
    <line x1="210" y1="104" x2="346" y2="104" stroke="#8985FF" stroke-opacity="0.5" stroke-dasharray="6 10">
      <animate attributeName="stroke-dashoffset" from="32" to="0" dur="1.6s" repeatCount="indefinite"/>
    </line>
    <line x1="355" y1="128" x2="219" y2="128" stroke="#4DA3FF" stroke-opacity="0.5" stroke-dasharray="6 10">
      <animate attributeName="stroke-dashoffset" from="32" to="0" dur="1.6s" begin="-0.8s" repeatCount="indefinite"/>
    </line>
    <line x1="525" y1="110" x2="661" y2="110" stroke="#4DA3FF" stroke-opacity="0.5" stroke-dasharray="6 10">
      <animate attributeName="stroke-dashoffset" from="32" to="0" dur="1.6s" begin="-0.4s" repeatCount="indefinite"/>
    </line>
    <path d="M755,150 L755,210 L440,210 L440,241" stroke="#2DC79A" stroke-opacity="0.5" stroke-dasharray="6 10">
      <animate attributeName="stroke-dashoffset" from="32" to="0" dur="2s" begin="-1.0s" repeatCount="indefinite"/>
    </path>
  </g>

  <g>
    <circle r="3" fill="#8985FF">
      <animateMotion path="M210,104 L346,104" dur="2.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.85;1" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <circle r="3" fill="#4DA3FF">
      <animateMotion path="M355,128 L219,128" dur="2.4s" begin="-1.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.85;1" dur="2.4s" begin="-1.2s" repeatCount="indefinite"/>
    </circle>
    <circle r="3" fill="#4DA3FF">
      <animateMotion path="M525,110 L661,110" dur="2.4s" begin="-0.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.85;1" dur="2.4s" begin="-0.6s" repeatCount="indefinite"/>
    </circle>
    <circle r="3" fill="#2DC79A">
      <animateMotion path="M755,150 L755,210 L440,210 L440,241" dur="3.2s" begin="-1.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.12;0.88;1" dur="3.2s" begin="-1.6s" repeatCount="indefinite"/>
    </circle>
  </g>

  <g font-size="11" fill="#A1A1A8" font-weight="500">
    <text x="282" y="98" text-anchor="middle">写入</text>
    <text x="282" y="142" text-anchor="middle">回执 · O(1)</text>
    <text x="593" y="104" text-anchor="middle">持久化</text>
    <text x="600" y="204" text-anchor="middle">SSE · 全量回看 → 仪表盘</text>
  </g>

  <g>
    <rect x="40" y="70" width="170" height="80" rx="15" fill="#8985FF" fill-opacity="0.16" stroke="#8985FF" stroke-width="1.5">
      <animate attributeName="fill-opacity" values="0.16;0.24;0.16" keyTimes="0;0.5;1" dur="3.2s"
               calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1" repeatCount="indefinite"/>
    </rect>
    <text x="125" y="105" text-anchor="middle" font-size="14" font-weight="600" fill="#B9B6FF">AI 智能体</text>
    <text x="125" y="124" text-anchor="middle" font-size="11" fill="#A1A1A8">Claude Code · Cursor</text>

    <rect x="355" y="70" width="170" height="80" rx="15" fill="#4DA3FF" fill-opacity="0.16" stroke="#4DA3FF" stroke-width="1.5">
      <animate attributeName="fill-opacity" values="0.16;0.24;0.16" keyTimes="0;0.5;1" dur="3.2s" begin="-1.1s"
               calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1" repeatCount="indefinite"/>
    </rect>
    <text x="440" y="105" text-anchor="middle" font-size="14" font-weight="600" fill="#7FC0FF">MemPeek MCP</text>
    <text x="440" y="124" text-anchor="middle" font-size="11" fill="#A1A1A8">ZTMR 服务 · Node 22</text>

    <rect x="670" y="70" width="170" height="80" rx="15" fill="#2DC79A" fill-opacity="0.16" stroke="#2DC79A" stroke-width="1.5">
      <animate attributeName="fill-opacity" values="0.16;0.24;0.16" keyTimes="0;0.5;1" dur="3.2s" begin="-2.2s"
               calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1" repeatCount="indefinite"/>
    </rect>
    <text x="755" y="105" text-anchor="middle" font-size="14" font-weight="600" fill="#5FD8B3">SQLite 存储</text>
    <text x="755" y="124" text-anchor="middle" font-size="11" fill="#A1A1A8">mempeek.db</text>

    <rect x="355" y="250" width="170" height="80" rx="15" fill="#8985FF" fill-opacity="0.16" stroke="#8985FF" stroke-width="1.5">
      <animate attributeName="fill-opacity" values="0.16;0.24;0.16" keyTimes="0;0.5;1" dur="3.2s" begin="-0.55s"
               calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1" repeatCount="indefinite"/>
    </rect>
    <text x="440" y="285" text-anchor="middle" font-size="14" font-weight="600" fill="#B9B6FF">仪表盘</text>
    <text x="440" y="304" text-anchor="middle" font-size="11" fill="#A1A1A8">localhost:7331</text>
  </g>
</svg>
