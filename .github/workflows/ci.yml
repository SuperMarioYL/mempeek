name: ci
on:
  push:
    branches: [main, master]
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm install
      - run: npm run typecheck
      - run: npm run build
      - name: Test suite (version lockstep, CLI contracts, demo session, MCP stdio e2e)
        run: npm test
      - name: Smoke-test the demo
        run: node dist/index.js --demo
